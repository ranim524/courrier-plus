services:
  - type: web
    name: courrier-plus-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      # DATABASE_URL points at an external Neon Postgres instance, not a
      # Render-managed database defined in this Blueprint -- Render's
      # `fromDatabase` reference only works for a `databases:` resource
      # declared in this same render.yaml, which doesn't apply here. `sync:
      # false` is the correct secure equivalent for an external DB: Render
      # prompts for the value once in its dashboard (encrypted at rest
      # there) and it never touches this file or the git history.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRATION_MINUTES
        value: "60"
      - key: ACCESS_TOKEN_EXPIRATION_DAYS
        value: "30"
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: RESEND_FROM_NAME
        value: Courrier+
      - key: PAYMENT_PROVIDER
        value: mock
      - key: CURRENCY
        value: TND
      # "database" stores PDFs as bytes in the Postgres database above
      # (document_blobs table) -- no object-storage account, API key, or
      # payment method needed. Switch to "r2" (see R2StorageProvider) later
      # if document volume outgrows this; that only needs adding the four
      # R2_* vars back here, no other code change.
      - key: STORAGE_PROVIDER
        value: database
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"
      - key: FIRST_ADMIN_EMAIL
        sync: false
      - key: FIRST_ADMIN_PASSWORD
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
